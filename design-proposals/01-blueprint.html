<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>译禾 · 蓝图精度</title>
  <style>
    :root { --ink:#10213f; --muted:#5d6d86; --line:#dbe4f0; --soft:#f5f8fc; --brand:#2764d8; --brand-dark:#174ba9; --focus:#80a8ff; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#f7f9fc; font:14px/1.5 Inter,"Microsoft YaHei",system-ui,sans-serif; }
    .shell { min-height:100vh; display:grid; grid-template-columns:236px 1fr; background:linear-gradient(90deg,#fff 0 236px,transparent 236px),linear-gradient(#eaf0f8 1px,transparent 1px),linear-gradient(90deg,#eaf0f8 1px,transparent 1px); background-size:auto,32px 32px,32px 32px; }
    aside { padding:24px 16px; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; }
    .mark { display:flex; align-items:center; gap:10px; padding:0 8px 28px; font-weight:750; letter-spacing:-.03em; font-size:17px; }
    .mark i { width:26px; height:26px; display:grid; place-items:center; font-style:normal; color:#fff; background:var(--brand); clip-path:polygon(0 0,100% 0,100% 68%,68% 100%,0 100%); }
    .mark small { display:block; color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
    nav { display:grid; gap:4px; } nav a { color:#53637c; text-decoration:none; padding:10px 12px; border-left:2px solid transparent; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:color .18s,background .18s,border-color .18s; } nav a:hover { color:var(--ink); background:#f2f6fc; } nav a.active { color:var(--brand); border-left-color:var(--brand); background:#eef4ff; font-weight:700; }
    .status { margin-top:auto; border:1px solid var(--line); padding:12px; background:#fafcff; } .status b { font-size:12px; } .status p { margin:8px 0 0; color:var(--muted); font-size:12px; } .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#18a469; margin-right:6px; }
    main { padding:32px 40px 56px; max-width:1280px; width:100%; } .crumb { color:var(--brand); font-size:12px; font-weight:700; letter-spacing:.05em; } h1 { margin:8px 0 2px; letter-spacing:-.05em; font-size:32px; } .lead { margin:0; color:var(--muted); }
    .rule { height:1px; background:var(--line); margin:28px 0; } .topline { display:flex; align-items:start; justify-content:space-between; gap:24px; } .eyebrow { color:var(--muted); font-size:12px; padding-top:8px; }
    .panel { background:#fff; border:1px solid var(--line); } .panel-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); } .panel-head h2 { font-size:16px; margin:0; } .tag { color:var(--brand); font-size:12px; font-weight:700; background:#eef4ff; padding:3px 8px; }
    .content { padding:20px; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; max-width:900px; } label { display:grid; gap:7px; font-size:12px; font-weight:700; color:#3b4c66; }
    input,select { appearance:none; width:100%; min-height:42px; border:1px solid #bfcbdd; background:#fff; color:var(--ink); padding:0 12px; font:inherit; outline:none; border-radius:2px; transition:border-color .18s, box-shadow .18s; } select { background-image:linear-gradient(45deg,transparent 50%,#62738e 50%),linear-gradient(135deg,#62738e 50%,transparent 50%); background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; } input:focus-visible,select:focus-visible,.button:focus-visible { border-color:var(--brand); box-shadow:0 0 0 3px var(--focus); }
    .check { grid-template-columns:18px 1fr; align-items:center; min-height:42px; padding:0 12px; border:1px solid #bfcbdd; font-size:13px; font-weight:600; background:#fbfdff; cursor:pointer; } .check input { width:15px; min-height:auto; accent-color:var(--brand); }
    .foot { border-top:1px solid var(--line); padding:16px 20px; display:flex; gap:12px; justify-content:space-between; align-items:center; } .foot small { color:var(--muted); } .button { border:1px solid var(--brand); background:var(--brand); color:#fff; min-height:36px; padding:0 16px; font:700 13px inherit; border-radius:2px; cursor:pointer; transition:background .18s,border .18s; } .button:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
    .index { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; color:#7e8da4; } @media (max-width:760px) { .shell { grid-template-columns:1fr; } aside { display:none; } main { padding:24px 16px; } .grid { grid-template-columns:1fr; } .topline,.panel-head,.foot { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="mark"><i>Y</i><span>译禾工具合集<small>Localization Tooling</small></span></div>
      <nav><a>工作台 <span>⌘1</span></a><a>文本预处理</a><a>Diff 工具</a><a class="active">AI 审校</a><a>跨 Excel 搜索</a><a>设置</a></nav>
      <div class="status"><b><span class="dot"></span>服务运行正常</b><p>本地模式 · 127.0.0.1:8765</p></div>
    </aside>
    <main>
      <div class="topline"><div><div class="crumb">AI REVIEW / SETTINGS</div><h1>审校设置</h1><p class="lead">管理审校参数与调试选项。</p></div><div class="eyebrow">LOCAL WORKSPACE · v2.8.0</div></div>
      <div class="rule"></div>
      <section class="panel"><header class="panel-head"><h2>参数设置</h2><span class="tag">当前模型配置</span></header><div class="content"><div class="grid"><label>思考强度<select><option>低</option><option>中</option><option>高</option></select></label><label class="check"><input type="checkbox" />记录调试请求内容</label><label>单包字符预算<input value="20000" /></label><label>单包条目上限<input value="80" /></label></div></div><footer class="foot"><small>配置将应用于下一次审校任务。</small><button class="button">保存设置</button></footer></section>
      <p class="index">01 / BLUEPRINT PRECISION · light / grid / cobalt</p>
    </main>
  </div>
</body>
</html>
