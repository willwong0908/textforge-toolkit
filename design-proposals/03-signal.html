<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>译禾 · 信号简约</title>
<style>
  :root{--black:#111827;--gray:#667085;--line:#e5e8ee;--pale:#f8fafc;--blue:#1769e0;--blue-pale:#edf4ff;--yellow:#f4b740}*{box-sizing:border-box}body{margin:0;color:var(--black);background:#fff;font:14px/1.55 Inter,"Microsoft YaHei",system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.logo{padding:4px 10px 30px;font-weight:800;letter-spacing:-.04em;font-size:17px}.logo span{color:var(--blue)}.logo small{display:block;color:var(--gray);font-size:10px;font-weight:600;letter-spacing:.1em;margin-top:1px}.nav-label{padding:0 10px 7px;color:#98a2b3;font-size:10px;letter-spacing:.1em;font-weight:800}.nav{display:grid;gap:2px}.nav a{padding:9px 10px;text-decoration:none;color:#526078;border-radius:4px;cursor:pointer;transition:.18s}.nav a:hover{background:var(--pale);color:var(--black)}.nav a.active{background:var(--blue-pale);color:#104da6;font-weight:750;position:relative}.nav a.active::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;background:var(--blue);transform:translateY(-50%);border-radius:50%}.side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--gray)}.side-foot b{color:#2d3748;display:block;margin-bottom:3px}.side-foot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#20a46b;margin-right:5px}
  main{padding:0 48px 52px;max-width:1240px}.header{height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.bread{font-size:12px;color:var(--gray)}.bread b{color:#344054}.help{border:1px solid var(--line);background:#fff;color:#475467;padding:7px 10px;font:600 12px inherit;cursor:pointer;border-radius:4px}.help:hover{border-color:#a8b7cc;color:var(--black)}.intro{padding:34px 0 30px;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;align-items:end}.intro h1{font-size:30px;letter-spacing:-.055em;margin:0 0 5px}.intro p{margin:0;color:var(--gray)}.counter{font:11px ui-monospace,Consolas,monospace;color:var(--gray)}.counter b{color:var(--blue)}.setting{display:grid;grid-template-columns:190px 1fr;min-height:330px;border-bottom:1px solid var(--line)}.setting-aside{padding:24px 24px 18px 0;border-right:1px solid var(--line)}.setting-aside h2{margin:0 0 8px;font-size:16px}.setting-aside p{margin:0;color:var(--gray);font-size:12px}.setting-body{padding:24px 0 20px 30px;max-width:760px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:19px}.control{display:grid;gap:7px;color:#475467;font-size:12px;font-weight:750}.control select,.control input{width:100%;height:42px;border:1px solid #cbd3df;border-radius:4px;padding:0 11px;background:#fff;color:var(--black);font:14px inherit;outline:none;transition:.18s}.control select:focus-visible,.control input:focus-visible,.primary:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px #cfe0ff}.check{height:42px;display:flex;align-items:center;gap:8px;border:1px solid #cbd3df;border-radius:4px;padding:0 11px;color:#344054;cursor:pointer;font-weight:650}.check input{accent-color:var(--blue);width:15px;height:15px}.action{padding-top:3px;display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.primary{height:36px;background:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:0 15px;color:#fff;font:700 13px inherit;cursor:pointer;transition:.18s}.primary:hover{background:#1059bd}.note{margin-top:17px;color:#98a2b3;font:11px ui-monospace,Consolas,monospace}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}main{padding:0 18px 38px}.setting{grid-template-columns:1fr}.setting-aside{border-right:0;border-bottom:1px solid var(--line);padding-right:0}.setting-body{padding-left:0}.row{grid-template-columns:1fr}.intro{align-items:start;gap:15px;flex-direction:column}}
</style></head>
<body><div class="app"><aside class="side"><div class="logo"><span>YH</span> 译禾工具合集<small>LOCALIZATION & TEXT TOOLING</small></div><div class="nav-label">WORKSPACE</div><nav class="nav"><a>工作台</a><a>文本预处理</a><a>Diff 工具</a><a class="active">AI 审校</a><a>跨 Excel 搜索</a><a>设置</a></nav><div class="side-foot"><b><i></i>服务正常</b>本地模式 · v2.8.0</div></aside><main><header class="header"><div class="bread"><b>AI 审校</b> / 参数设置</div><button class="help">查看使用说明</button></header><section class="intro"><div><h1>审校设置</h1><p>管理审校参数与调试选项。</p></div><div class="counter"><b>02</b> / SETTINGS</div></section><section class="setting"><div class="setting-aside"><h2>参数设置</h2><p>统一使用“模型设置”中的当前模型与 API 配置。</p></div><div class="setting-body"><div class="row"><label class="control">思考强度<select><option>低</option><option>中</option><option>高</option></select></label><label class="control">调试<label class="check"><input type="checkbox">记录调试请求内容</label></label></div><div class="row"><label class="control">单包字符预算<input value="20000"></label><label class="control">单包条目上限<input value="80"></label></div><div class="action"><button class="primary">保存设置</button></div></div></section><div class="note">03 / SIGNAL MINIMAL · light / editorial / electric blue</div></main></div></body></html>
