<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>译禾 · 深空界面</title>
  <style>
    :root { --bg:#0a1020; --panel:#101a2d; --panel-2:#0d1627; --line:#25344e; --text:#edf3ff; --muted:#91a0ba; --blue:#5d8dff; --aqua:#58d7c2; --focus:#9fb9ff; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Microsoft YaHei",system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:244px 1fr;background:radial-gradient(circle at 82% 8%,#162a4c 0,transparent 25%),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
    aside{padding:22px 14px;border-right:1px solid var(--line);background:rgba(8,14,27,.88);display:flex;flex-direction:column;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 30px;font-size:16px;font-weight:750}.brand b{display:grid;place-items:center;width:25px;height:25px;background:var(--blue);color:#091120;font-size:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
    nav{display:grid;gap:4px}nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#aab8ce;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:color .18s,background .18s,border-color .18s,box-shadow .18s}nav a::before{content:"";width:5px;height:5px;border:1px solid #5f7090}nav a:hover{color:#fff;background:rgba(74,104,153,.14);border-color:rgba(139,171,225,.15)}nav a.active{color:#fff;border-color:rgba(120,159,230,.38);background:linear-gradient(115deg,rgba(89,141,255,.22),rgba(88,215,194,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.12);backdrop-filter:blur(12px) saturate(130%)}nav a.active::before{background:var(--aqua);border-color:var(--aqua);box-shadow:0 0 10px rgba(88,215,194,.55)}.status{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px 2px;color:var(--muted);font-size:12px}.status strong{display:block;color:#dfeaff;font-size:12px;margin-bottom:5px}.signal{display:inline-block;width:7px;height:7px;background:var(--aqua);margin-right:6px;box-shadow:0 0 0 3px rgba(88,215,194,.12)}
    main{width:min(1180px,100%);padding:38px 46px 56px}.kicker{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--aqua);letter-spacing:.1em}.head{display:flex;justify-content:space-between;gap:22px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:25px}.head h1{font-size:34px;letter-spacing:-.055em;margin:6px 0}.head p{color:var(--muted);margin:0}.session{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}.session b{color:var(--aqua);font-weight:600}
    .panel{margin-top:24px;border:1px solid rgba(101,133,184,.36);background:linear-gradient(135deg,rgba(31,49,80,.72),rgba(13,22,39,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 46px rgba(0,0,0,.16);backdrop-filter:blur(20px) saturate(120%)}.panel header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(101,133,184,.3)}.panel h2{font-size:15px;margin:0}.panel h2::before{content:"// ";color:var(--aqua);font-family:ui-monospace,monospace}.model{color:var(--muted);font-size:12px}.model b{color:#dce6ff}.fields{padding:19px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px;color:#b8c6dc;font-size:12px;font-weight:650}.field input,.field select{width:100%;min-height:44px;border:1px solid rgba(117,148,198,.42);background:rgba(7,15,30,.48);color:var(--text);padding:0 12px;border-radius:3px;font:inherit;outline:none;transition:border-color .18s,box-shadow .18s,background .18s;backdrop-filter:blur(10px)}.field input:hover,.field select:hover{border-color:rgba(152,184,241,.62);background:rgba(20,33,56,.58)}.field input:focus-visible,.field select:focus-visible,.save:focus-visible{border-color:#81a9ff;box-shadow:0 0 0 3px rgba(93,141,255,.28)}.check{display:flex;align-items:center;gap:9px;min-height:44px;border:1px solid rgba(117,148,198,.42);background:rgba(7,15,30,.48);padding:0 12px;color:#d8e3f8;cursor:pointer;font-size:13px;transition:border-color .18s,background .18s,box-shadow .18s;backdrop-filter:blur(10px)}.check:hover{border-color:rgba(152,184,241,.62);background:rgba(20,33,56,.58)}.check input{width:15px;height:15px;accent-color:var(--blue)}.bottom{padding:14px 18px;border-top:1px solid rgba(101,133,184,.3);display:flex;justify-content:space-between;align-items:center}.bottom small{color:var(--muted)}.save{position:relative;isolation:isolate;overflow:hidden;min-height:44px;padding:0 18px;color:#eff5ff;font:700 13px inherit;letter-spacing:.01em;cursor:pointer;border:1px solid rgba(164,193,255,.58);border-radius:4px;background:linear-gradient(115deg,rgba(122,164,255,.32),rgba(90,215,194,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(7,19,44,.28),0 8px 22px rgba(43,92,194,.2);backdrop-filter:blur(16px) saturate(145%);transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}.save::before{content:"";position:absolute;z-index:-1;inset:1px 45% 1px 1px;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent);opacity:.72}.save:hover{transform:translateY(-1px);border-color:rgba(192,215,255,.9);background:linear-gradient(115deg,rgba(127,169,255,.47),rgba(90,215,194,.24));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 28px rgba(43,92,194,.3)}.save:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(3,13,33,.45)}.stamp{color:#6c7d99;font:11px ui-monospace,monospace;margin-top:18px}@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important}}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:26px 16px}.head{align-items:start;flex-direction:column}.session{text-align:left}.fields{grid-template-columns:1fr}.bottom{align-items:start;gap:14px;flex-direction:column}}
  </style>
</head>
<body><div class="shell"><aside><div class="brand"><b>YH</b><span>译禾工具合集<small>LOCALIZATION TOOLING</small></span></div><nav><a>工作台</a><a>文本预处理</a><a>Diff 工具</a><a class="active">AI 审校</a><a>跨 Excel 搜索</a><a>设置</a></nav><div class="status"><strong><span class="signal"></span>LOCAL SERVICE / ONLINE</strong>127.0.0.1:8765 · idle</div></aside><main><div class="head"><div><div class="kicker">AI REVIEW / CONFIGURATION</div><h1>审校设置</h1><p>管理审校参数与调试选项。</p></div><div class="session">RUNTIME <b>CONNECTED</b><br>MODEL CONFIG / DEFAULT</div></div><section class="panel"><header><h2>参数设置</h2><span class="model">模型：<b>当前工具配置</b></span></header><div class="fields"><label class="field">思考强度<select><option>低</option><option>中</option><option>高</option></select></label><label class="check"><input type="checkbox">记录调试请求内容</label><label class="field">单包字符预算<input value="20000"></label><label class="field">单包条目上限<input value="80"></label></div><footer class="bottom"><small>变更仅影响之后创建的审校任务。</small><button class="save">保存设置</button></footer></section><div class="stamp">02 / NOCTURNE CONTROL · dark / structured / low-glow</div></main></div></body>
</html>
